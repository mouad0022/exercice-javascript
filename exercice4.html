<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercice 4 - Somme de temps</title>
</head>
<body>

    <!-- Titre et champs de saisie HTML pour les trois mesures de temps (heures, minutes, secondes)[cite: 71] -->
    <h3>Entrer les trois mesures de temps :</h3>
    <p>Temps 1 : <input type="number" id="h1" value="2"> h <input type="number" id="m1" value="23"> min <input type="number" id="s1" value="2"> s</p>
    <p>Temps 2 : <input type="number" id="h2" value="23"> h <input type="number" id="m2" value="2"> min <input type="number" id="s2" value="1"> s</p>
    <p>Temps 3 : <input type="number" id="h3" value="233"> h <input type="number" id="m3" value="23"> min <input type="number" id="s3" value="23"> s</p>
    
    <!-- Bouton qui déclenche la fonction JavaScript au clic[cite: 30, 40] -->
    <input type="button" value="Calculer la somme" onclick="calculerTemps()">

    <script type="text/javascript">
        // Fonction principale qui s'exécute lorsqu'on clique sur le bouton[cite: 20, 30]
        function calculerTemps() {
            
            // ÉTAPE 1 : Récupérer les valeurs tapées par l'utilisateur pour chaque champ et les transformer en nombres entiers (parseInt)[cite: 28].
            // Si le champ est vide, on utilise "|| 0" pour dire que la valeur par défaut est 0.
            var h1 = parseInt(document.getElementById('h1').value) || 0;
            var m1 = parseInt(document.getElementById('m1').value) || 0;
            var s1 = parseInt(document.getElementById('s1').value) || 0;

            var h2 = parseInt(document.getElementById('h2').value) || 0;
            var m2 = parseInt(document.getElementById('m2').value) || 0;
            var s2 = parseInt(document.getElementById('s2').value) || 0;

            var h3 = parseInt(document.getElementById('h3').value) || 0;
            var m3 = parseInt(document.getElementById('m3').value) || 0;
            var s3 = parseInt(document.getElementById('s3').value) || 0;

            // ÉTAPE 2 : Additionner d'abord toutes les secondes ensemble.
            var totalSec = s1 + s2 + s3;
            
            // Convertir l'excédent de secondes en minutes : 
            // On ajoute aux minutes les minutes complètes contenues dans les secondes (totalSec / 60, arrondi avec Math.floor).
            var totalMin = m1 + m2 + m3 + Math.floor(totalSec / 60);
            
            // On garde uniquement les secondes restantes qui font moins de 60 (grâce au modulo %).
            totalSec = totalSec % 60;

            // ÉTAPE 3 : Convertir l'excédent de minutes en heures :
            // On ajoute aux heures les heures complètes contenues dans les minutes (totalMin / 60, arrondi avec Math.floor).
            var totalHour = h1 + h2 + h3 + Math.floor(totalMin / 60);
            
            // On garde uniquement les minutes restantes qui font moins de 60.
            totalMin = totalMin % 60;

            // ÉTAPE 4 : Convertir l'excédent d'heures en jours :
            // Un jour fait 24 heures. On calcule le nombre de jours complets (totalHour / 24, arrondi avec Math.floor).
            var totalDay = Math.floor(totalHour / 24);
            
            // On garde uniquement les heures restantes qui font moins de 24.
            totalHour = totalHour % 24;

            // ÉTAPE 5 : Afficher le résultat final calculé directement dans la page web[cite: 11].
            document.write("<h3>Total des trois temps : " + totalDay + " Jour(s) " + totalHour + " Heure(s) " + totalMin + " Minute(s) " + totalSec + " Seconde(s)</h3>");
        }
    </script>

</body>
</html>
