<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exercice 4 - Somme de temps</title>
</head>
<body>

    <h3>Entrer les trois mesures de temps :</h3>
    <p>Temps 1 : <input type="number" id="h1" value="2"> h <input type="number" id="m1" value="23"> min <input type="number" id="s1" value="2"> s</p>
    <p>Temps 2 : <input type="number" id="h2" value="23"> h <input type="number" id="m2" value="2"> min <input type="number" id="s2" value="1"> s</p>
    <p>Temps 3 : <input type="number" id="h3" value="233"> h <input type="number" id="m3" value="23"> min <input type="number" id="s3" value="23"> s</p>
    <input type="button" value="Calculer la somme" onclick="calculerTemps()">

    <script type="text/javascript">
        function calculerTemps() {
            var h1 = parseInt(document.getElementById('h1').value) || 0;
            var m1 = parseInt(document.getElementById('m1').value) || 0;
            var s1 = parseInt(document.getElementById('s1').value) || 0;

            var h2 = parseInt(document.getElementById('h2').value) || 0;
            var m2 = parseInt(document.getElementById('m2').value) || 0;
            var s2 = parseInt(document.getElementById('s2').value) || 0;

            var h3 = parseInt(document.getElementById('h3').value) || 0;
            var m3 = parseInt(document.getElementById('m3').value) || 0;
            var s3 = parseInt(document.getElementById('s3').value) || 0;

            var totalSec = s1 + s2 + s3;
            var totalMin = m1 + m2 + m3 + Math.floor(totalSec / 60);
            totalSec = totalSec % 60;

            var totalHour = h1 + h2 + h3 + Math.floor(totalMin / 60);
            totalMin = totalMin % 60;

            var totalDay = Math.floor(totalHour / 24);
            totalHour = totalHour % 24;

            document.write("<h3>Total des trois temps : " + totalDay + " Jour(s) " + totalHour + " Heure(s) " + totalMin + " Minute(s) " + totalSec + " Seconde(s)</h3>");
        }
    </script>

</body>
</html>
